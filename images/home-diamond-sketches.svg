      <path d="m104 147 27-88 25-27 24 32-8 83Z"/>
      <path d="m131 59 25 30 24-25M156 32v57M104 147l52-58 16 58M131 59l9 52 16-22 16 58"/>
      <path d="M2 151h181" opacity="0.45"/>
    </symbol>
  </defs>

  <g fill="none" stroke="#aeb4b2" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" opacity="0.48">
