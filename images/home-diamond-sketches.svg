    <use href="#crystal-cluster" x="940" y="185" width="140" height="115" transform="rotate(3 1010 243)"/>
    <use href="#octahedron" x="1110" y="220" width="55" height="82" transform="rotate(-5 1138 261)"/>
    <use href="#prism" x="1200" y="165" width="76" height="170" transform="rotate(4 1238 250)"/>
    <use href="#cut-diamond" x="1310" y="235" width="90" height="65" transform="rotate(-4 1355 268)" opacity="0.68"/>
