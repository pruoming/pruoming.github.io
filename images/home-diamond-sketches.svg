      <path d="m10 41 35 25 34-27M45 3v63M18 143l27-77 24 78M28 54l4 99M63 54l-6 101"/>
    </symbol>
    <symbol id="rough-stone" viewBox="0 0 115 100">
      <path d="m8 31 28-24 44 7 27 31-15 38-43 13L13 72Z"/>
