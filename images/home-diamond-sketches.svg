    <use href="#crystal-cluster" x="120" y="170" width="190" height="154" transform="rotate(-3 215 247)"/>
    <use href="#prism" x="340" y="200" width="42" height="100" transform="rotate(5 361 250)"/>
    <use href="#octahedron" x="415" y="185" width="88" height="130" transform="rotate(-4 459 250)"/>
    <use href="#cut-diamond" x="540" y="230" width="105" height="75" transform="rotate(4 593 268)" opacity="0.68"/>

