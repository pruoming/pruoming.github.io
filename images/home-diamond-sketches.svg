<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 340" role="img" aria-labelledby="title desc">
  <title id="title">Scattered diamond crystal sketches</title>
  <desc id="desc">Original light-grey line drawings of varied diamonds and crystals scattered loosely around an open center.</desc>

  <defs>
    <symbol id="cut-diamond" viewBox="0 0 140 105">
